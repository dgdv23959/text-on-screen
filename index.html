<style>
:root{
  --ground:#EAE8E9;
  --surface:#F5F4F5;
  --surface-2:#E1DEE1;
  --ink:#191720;
  --ink-soft:#5C5866;
  --ink-faint:#8B8794;
  --line:#D3D0D5;
  --line-strong:#BEBAC2;
  --accent:#8C4A63;
  --accent-ink:#FFFFFF;
  --focus:#8C4A63;

  --hue-rel:#B5813C;
  --hue-lng:#9C5573;
  --hue-brk:#4A6480;
  --wash-op:.13;

  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131218;
    --surface:#1D1C24;
    --surface-2:#26242F;
    --ink:#EFEDF1;
    --ink-soft:#A29EAC;
    --ink-faint:#787484;
    --line:#2E2C38;
    --line-strong:#413E4D;
    --accent:#CE8FA8;
    --accent-ink:#1A1017;
    --focus:#CE8FA8;
    --hue-rel:#D8A75E;
    --hue-lng:#CE8FA8;
    --hue-brk:#82A3C6;
    --wash-op:.16;
  }
}
:root[data-theme="dark"]{
  --ground:#131218;
  --surface:#1D1C24;
  --surface-2:#26242F;
  --ink:#EFEDF1;
  --ink-soft:#A29EAC;
  --ink-faint:#787484;
  --line:#2E2C38;

  --hue-rel:#D8A75E;
  --hue-lng:#CE8FA8;
  --hue-brk:#82A3C6;
  --wash-op:.16;
}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  position:relative;
  isolation:isolate;
}

/* ambient wash — colour follows the emotional register of the line on screen */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:radial-gradient(90% 75% at 50% 42%,var(--mood,var(--hue-lng)) 0%,transparent 100%);
  opacity:var(--wash-op);
  transition:background .6s ease;
  pointer-events:none;
}
body[data-mood="0"]{--mood:var(--hue-rel)}
body[data-mood="1"]{--mood:var(--hue-lng)}
body[data-mood="2"]{--mood:var(--hue-brk)}

.wordmark{
  font-family:var(--serif);
  font-weight:300;
  font-size:1.0625rem;
  letter-spacing:-.01em;
  color:var(--ink-soft);
  padding:26px 28px 0;
  margin:0;
}
.wordmark em{font-style:italic;color:var(--accent)}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:38px;
  padding:44px 24px 64px;
  text-align:center;
}

.no{
  font-family:var(--mono);
  font-size:.75rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
  margin:0;
}

.line{
  font-family:var(--serif);
  font-weight:300;
  font-size:clamp(1.75rem,4.4vw,3rem);
  line-height:1.24;
  letter-spacing:-.015em;
  text-wrap:balance;
  max-width:17ch;
  margin:0;
}
.line.swap{animation:cut .38s ease-out}
@keyframes cut{
  0%{opacity:0;transform:translateY(9px);filter:blur(5px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:none}
}

.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{
  font:inherit;
  font-size:.9375rem;
  font-weight:500;
  color:inherit;
  border:1px solid var(--line-strong);
  background:var(--surface);
  border-radius:999px;
  padding:12px 26px;
  cursor:pointer;
  transition:background .15s,border-color .15s,transform .08s,opacity .15s;
}
button:hover{background:var(--surface-2)}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.35;cursor:not-allowed}
button[disabled]:hover{background:var(--surface)}
#shuffle{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:transparent;
  font-weight:600;
  padding-inline:36px;
}
#shuffle:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

.toast{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translate(-50%,12px);
  background:var(--ink);
  color:var(--ground);
  padding:9px 18px;
  border-radius:999px;
  font-size:.875rem;
  font-weight:500;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (max-width:600px){
  .wordmark{padding:20px 20px 0}
  main{gap:32px;padding:36px 20px 56px}
  .line{max-width:14ch}
}
</style>

<p class="wordmark">Text on <em>Screen</em></p>

<main>
  <p class="no" id="no">No. 0000</p>

    <button id="back" disabled>Go back</button>
    <button id="shuffle">Shuffle</button>
    <button id="copy">Copy</button>
  </div>
</main>

    deck = [];
    for (var i=0;i<BANK.length;i++) deck.push(i);
    for (var j=deck.length-1;j>0;j--){
      var k = Math.floor(Math.random()*(j+1));
      var t = deck[j]; deck[j] = deck[k]; deck[k] = t;
    }
  }

  function render(i, animate){
    var q = BANK[i];
    document.body.setAttribute("data-mood", q[0]);
    lineEl.textContent = q[1];
    noEl.textContent = "No. " + String(i+1).padStart(4,"0");
    backBtn.disabled = pos <= 0;
    if (animate !== false){
      lineEl.classList.remove("swap");
      void lineEl.offsetWidth;
      lineEl.classList.add("swap");
    }
  }

  function shuffle(){
    if (pos < history.length - 1){        // stepped back, then shuffled: go forward again
      pos++;
      render(history[pos]);
      return;
    }
    if (!deck.length) refill();
    var i = deck.pop();
    history.push(i);
    if (history.length > 200) history.shift();
    pos = history.length - 1;
    render(i);
  }

  function back(){
    if (pos <= 0) return;
    pos--;
    render(history[pos]);
  }

  var toastEl = document.getElementById("toast"), toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1500);
  }
  function copyLine(){
    var text = lineEl.textContent;
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast("Copied"); }
      catch(err){ toast("Couldn't copy — select the text instead"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Copied"); }, fallback);
    } else fallback();
  }

  shuffleBtn.addEventListener("click", shuffle);
  document.getElementById("copy").addEventListener("click", copyLine);
  backBtn.addEventListener("click", back);

  document.addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
    if (e.code === "Space" || e.key === "ArrowRight"){ e.preventDefault(); shuffle(); }
    else if (e.key === "ArrowLeft"){ back(); }
    else if (e.key === "c" || e.key === "C"){ copyLine(); }
  });

  refill();
  shuffle();
  lineEl.classList.remove("swap");
})();
</script>
